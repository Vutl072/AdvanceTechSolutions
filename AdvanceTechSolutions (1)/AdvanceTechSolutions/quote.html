    <meta charset="UTF-8">

          content="Request a free IT service quotation from Advance Tech Solutions.">

    <title>Request a Quote | Advance Tech Solutions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <h1>Advance Tech Solutions</h1>
    </div>

    <nav>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="services.html">Services</a></li>

            <li>
                <a href="quote.html" class="active">
                    Request Quote
                </a>
            </li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

</header>


<main>

<section class="page-header">

    <h2>Request a Quote</h2>

    <p>
        Tell us what technology service you need.
    </p>

</section>


<section class="form-section">

    <form id="quoteForm" class="contact-form">

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="e.g. 071 234 5678"
            required
        >


        <label for="service">
            Service Required
        </label>

        <select id="service" name="service" required>

            <option value="">
                Select a service
            </option>

            <option value="computer-repair">
                Computer Repairs
            </option>

            <option value="networking">
                Network Installation
            </option>

            <option value="cctv">
                CCTV Installation
            </option>

            <option value="software">
                Software Installation
            </option>

            <option value="printer">
                Printer Support
            </option>

            <option value="security">
                IT Security
            </option>

        </select>


        <label for="budget">
            Estimated Budget
        </label>

        <select id="budget" name="budget">

            <option value="">
                Select budget
            </option>

            <option value="under1000">
                Under R1,000
            </option>

            <option value="1000-3000">
                R1,000 - R3,000
            </option>

            <option value="3000-5000">
                R3,000 - R5,000
            </option>

            <option value="5000+">
                Above R5,000
            </option>

        </select>


        <label for="description">
            Describe Your Requirements
        </label>

        <textarea
            id="description"
            name="description"
            rows="6"
            placeholder="Tell us more about the service you need..."
            required
        ></textarea>


        <button type="submit" class="btn">
            Submit Quote Request
        </button>

        <p id="quoteMessage" class="form-message"></p>

    </form>

</section>

</main>


<footer>

</footer>

</html>
